<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dress-Up Dreams</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4fa;--panel:#ffffff;--ink:#3a2a5c;--soft:#efe6fb;--accent:#8b5cf6;--on:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--panel:#241a38;--ink:#f1e9ff;--soft:#352753;--accent:#a78bfa;--on:#15101f}}
:root[data-theme="dark"]{--bg:#15101f;--panel:#241a38;--ink:#f1e9ff;--soft:#352753;--accent:#a78bfa;--on:#15101f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;gap:8px;padding:10px 12px 6px;overflow-x:auto}
.chip{flex:1 0 auto;min-height:48px;padding:0 16px;border:0;border-radius:24px;background:var(--soft);color:var(--ink);font:600 17px 'Fredoka','Trebuchet MS',sans-serif}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.stage{flex:1;min-height:200px;margin:4px 12px;border-radius:28px;position:relative;overflow:hidden}
.stage svg.doll{position:absolute;inset:0;width:100%;height:100%}
.pop{animation:pop .3s ease-out;transform-origin:50% 60%}
@keyframes pop{40%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.bgs{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.bgs button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.bgs button[aria-pressed="true"]{border-color:var(--accent)}
.acts{display:flex;gap:6px;padding:4px 12px 8px}
.acts button{flex:1;min-height:44px;border:0;border-radius:22px;background:var(--soft);color:var(--ink);font:600 13px 'Fredoka','Trebuchet MS',sans-serif}
#sv{background:var(--accent)!important;color:var(--on)!important}
.panel{background:var(--panel);border-radius:26px 26px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.tabs button{min-height:44px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);font:600 15px 'Fredoka','Trebuchet MS',sans-serif}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px;align-items:center}
.th{flex:0 0 68px;height:68px;border:3px solid transparent;border-radius:18px;background:var(--soft);padding:2px}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th svg{width:100%;height:100%;display:block}
.sw{flex:0 0 44px;height:44px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;overflow-x:auto}.tabs button{flex:0 0 auto;padding:0 14px}
.gal{position:absolute;inset:0;background:var(--panel);overflow:auto;padding:12px;z-index:5}.gal[hidden]{display:none}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.card{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:260/340}
.card .ld{position:absolute;inset:0;width:100%;border:0;background:none;padding:0}.card svg{width:100%;height:100%}
.card .dl{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#3a2a5c;font-size:16px}
.th{position:relative}
.gems{position:absolute;top:10px;left:10px;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--accent);color:var(--on);font:600 16px 'Fredoka','Trebuchet MS',sans-serif;z-index:2}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:6;font-size:15px;max-width:90%;text-align:center}.toast[hidden]{display:none}
.cost{position:absolute;left:2px;right:2px;bottom:2px;border-radius:12px;background:rgba(36,26,56,.82);color:#fff;font-size:13px;text-align:center;padding:1px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{min-height:84px;border:0;border-radius:22px;background:var(--soft);color:var(--ink);font:600 20px 'Fredoka','Trebuchet MS',sans-serif}.big small{display:block;font-size:14px;font-weight:400}.big:disabled{opacity:.5}
.field{position:relative;height:calc(100% - 50px);overflow:hidden;border-radius:18px;background:var(--soft)}
.sp{position:absolute;top:-60px;width:56px;height:56px;border:0;background:none;font-size:38px;animation:fall 3s linear forwards}@keyframes fall{to{top:100%}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cd{aspect-ratio:1;border:0;border-radius:18px;background:var(--accent);color:var(--on);font-size:34px}.cd.up{background:var(--soft);color:var(--ink)}.cd.ok{opacity:.5}
.tt{background:var(--soft);color:var(--ink)}
.cm{display:grid;gap:16px;justify-items:center}.hint{margin:0;font-size:20px;font-weight:600;text-align:center}
.bn{animation:bn .45s ease-out}@keyframes bn{0%{transform:scale(1)}35%{transform:scale(1.3)}60%{transform:scale(.92)}100%{transform:scale(1)}}
.sk{animation:sk .35s}@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}.tg{width:130px;height:130px;border-radius:50%;border:4px solid var(--ink)}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}.sw2{aspect-ratio:1;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.pp{grid-template-columns:1fr 1fr}.pb{opacity:.45;transition:opacity .12s,transform .12s,box-shadow .12s}.pb.on{opacity:1;filter:brightness(1.2);transform:scale(1.08);box-shadow:0 0 0 6px #fff,0 0 34px 12px rgba(255,255,255,.95);position:relative;z-index:2}
.big{font-size:17px}
.wz{display:grid;justify-items:center;gap:18px;position:relative;padding-top:20px}.wh{width:220px;height:220px;border-radius:50%;border:5px solid var(--ink);position:relative;transition:transform 4s cubic-bezier(.12,.7,.2,1);font:600 22px 'Fredoka',sans-serif;color:#2b2140}.wh span{position:absolute;left:calc(50% - 15px);top:calc(50% - 12px);width:30px;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff}.ptr{position:absolute;top:8px;left:calc(50% - 12px);border:12px solid transparent;border-top:22px solid var(--ink);border-bottom:0;z-index:3}
#play{position:fixed;inset:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#play .field{height:calc(100% - 64px)}
.mg{max-width:420px;margin-left:auto;margin-right:auto}
.stage{touch-action:none;user-select:none;-webkit-user-select:none}.gal{touch-action:pan-y}
.tw{display:flex;gap:4px;align-items:center;margin-bottom:8px}.tw .tabs{flex:1;min-width:0;margin-bottom:0;scrollbar-width:none}.tw .tabs::-webkit-scrollbar{display:none}
.ar{flex:0 0 34px;height:44px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:26px;font-weight:600;line-height:1}.ar:disabled{opacity:.3}
#tmenu{flex-basis:44px;font-size:20px;background:var(--accent);color:var(--on)}
.tw .cur{width:100%;padding:0 8px;min-height:44px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);font:600 18px 'Fredoka','Trebuchet MS',sans-serif}
.sheet{position:fixed;inset:0;z-index:15;background:rgba(20,10,35,.45);display:flex;align-items:flex-end}.sheet[hidden]{display:none}
.sheet .box{width:100%;max-height:70%;overflow-y:auto;touch-action:pan-y;background:var(--panel);border-radius:26px 26px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sheet h3{margin:0 4px 4px;font-size:18px}
.sheet .opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;border-radius:16px;background:var(--soft);color:var(--ink);font:600 18px 'Fredoka','Trebuchet MS',sans-serif;text-align:left}.sheet .opt[aria-pressed="true"]{background:var(--accent);color:var(--on)}
#dg,#pg{transform-box:fill-box;transform-origin:center}
.twirl{animation:tw .8s ease-in-out}@keyframes tw{50%{transform:scaleX(-1)}}
.hop{animation:hp .45s}@keyframes hp{40%{transform:translateY(-16px)}}
.wig{animation:wg .5s}@keyframes wg{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.fl{position:absolute;font-size:24px;pointer-events:none;z-index:4;animation:fl 1s ease-out forwards}@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.stk{position:absolute;width:48px;height:48px;z-index:1;touch-action:none;cursor:grab}
.trash{position:absolute;top:10px;left:calc(50% - 30px);width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);font-size:30px;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .12s,background .12s}.trash.hot{transform:scale(1.3);background:#ffb3b3}.trash[hidden]{display:none}.stk svg{width:100%;height:100%;pointer-events:none}
.toast{position:fixed;z-index:30}
.gh3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.gh3 b:nth-child(2){justify-self:center;font-size:20px}.gh3 .chip{min-height:34px;padding:0 12px;font-size:14px;flex:none;justify-self:end}
</style>
</head>
<body>
<div id="app">

 else if(vy<105&&vx>65&&vx<135){an($('dg'),'wig');fl(px,py,['😊','💖','✨'])}
 else if(vy>=105&&vy<300&&vx>15&&vx<185){an($('dg'),'twirl');fl(px,py,['✨','💫','⭐'])}
 else if(vy>=300&&vx>60&&vx<140){an($('dg'),'hop');fl(px,py,['🎵','💖'])}
 else fl(px,py,['✨'])}
function swipe(dir){const k=S.cat;if(k=='stk')return;const n=CATS[k].st.length;let i=S[k][0];for(let t=0;t<n;t++){i=(i+dir+n)%n;if(!lockedP(k,i))break}if(lockedP(k,i))return;S[k][0]=i;if(k=='dress')S.fit=[0,0];ui();pop();store();say(CATS[k].st[i])}
{let sx=0,sy=0,pd=false;const stg=$('stage'),ign=e=>e.target.closest('button,.stk,#gal,#play');
 stg.addEventListener('pointerdown',e=>{if(ign(e))return;pd=true;sx=e.clientX;sy=e.clientY});
 stg.addEventListener('pointercancel',()=>pd=false);
 stg.addEventListener('pointerup',e=>{if(!pd)return;pd=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)swipe(dx<0?1:-1);else if(Math.hypot(dx,dy)<12)react(e)})}
{const t=$('tabs'),upd=()=>{};
 const step=d=>{const i=ORDER.indexOf(S.cat);S.cat=ORDER[(i+d+ORDER.length)%ORDER.length];ui()};$('tl').onclick=()=>step(-1);$('tr').onclick=()=>step(1);$('tabs').onclick=openSheet;
 t.addEventListener('scroll',upd);new ResizeObserver(upd).observe(t);setTimeout(upd,50)}
function openSheet(){$('sheet').innerHTML=`<div class="box"><h3>Pick a category</h3>${ORDER.map(k=>`<button class="opt" data-sc="${k}" aria-pressed="${k==S.cat}">${EM[k]} ${CATS[k].n}</button>`).join('')}</div>`;$('sheet').hidden=false}
$('tmenu').onclick=openSheet;
$('sheet').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b){S.cat=b.dataset.sc;ui();const t=document.querySelector('[data-cat="'+S.cat+'"]');if(t)t.scrollIntoView({inline:'center',block:'nearest'})}if(b||e.target.id=='sheet')$('sheet').hidden=true});
setTimeout(()=>say('Tip: swipe the stage to browse, tap to play!'),1200);
$('play').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.pg;
 if(p=='x'){clearInterval(T);$('play').hidden=true}
 else if(p=='qcatch'){const n=+$('sc').textContent;if(n){earn(n);say('Kept your '+n+' gems!')}playMenu()}
 else if(p=='menu')playMenu();
 else if(p=='gift'){GIFT=new Date().toDateString();earn(5);say('+5 gems!');playMenu()}
 else if(p=='catch')startCatch();
 else if(p=='memory')startMem();
 else if(p=='ttt')startTTT();
 else if(p=='color')startColor();
 else if(p=='pattern')startPat();
 else if(p=='spin')startSpin()});
restore();ui();
</script>
